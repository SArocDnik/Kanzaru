[project]
name = "kanzaru-backend"
version = "0.1.0"
description = "Story translation app with TTS — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.4.0",
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
tts = [
    "vieneu>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
